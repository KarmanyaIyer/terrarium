[package]
name = "terrarium"
version = "0.1.0"
description = "Terrarium: local LLM agents in sandboxed environments"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
# No strip: on this toolchain stripped Mach-O files fail to load ("mis-aligned LINKEDIT string pool").
strip = false

[profile.release.build-override]
strip = false
